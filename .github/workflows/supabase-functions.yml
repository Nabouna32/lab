name: Supabase Edge Functions CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - ".github/workflows/supabase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Edge Function dependencies
    runs-on: [self-hosted, Windows, X64, loculary-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false

      - name: Clean workspace while preserving local caches
        shell: pwsh
        run: git clean -ffdx -e node_modules -e .next

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.1.4

      - name: Validate locked dependencies and function types
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($function in @('account-delete', 'admin-user-sessions', 'admin-user-suspension')) {
            Push-Location "supabase/functions/$function"
            try {
              deno check --frozen index.ts
              if ($LASTEXITCODE -ne 0) { throw "deno check failed for $function" }
            }
            finally {
              Pop-Location
            }
          }
