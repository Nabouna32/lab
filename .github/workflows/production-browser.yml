name: Production Browser Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-browser-validation
  cancel-in-progress: true

jobs:
  browser:
    name: Production Playwright screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production browser validation
        env:
          BASE_URL: https://loculary.vercel.app
        run: npx playwright test e2e/production-visual.spec.mjs

      - name: Upload production screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-screenshots
          path: test-results/
          if-no-files-found: warn
