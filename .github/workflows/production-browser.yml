name: Production Browser Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-browser-validation
  cancel-in-progress: true

jobs:
  browser:
    name: Production runtime and hydration smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run this workflow from main so the checked SHA can be matched to production."
            exit 1
          fi

      - name: Wait for production alias to serve this commit
        id: deployment
        shell: bash
        env:
          HEAD_SHA: ${{ github.sha }}
          BASE_URL: https://loculary.vercel.app/fr
        run: |
          expected="$HEAD_SHA"
          observed=""
          for attempt in $(seq 1 60); do
            response_headers="$(curl -fsSL -D - -o /dev/null --max-time 5 "$BASE_URL" 2>/dev/null || true)"
            observed="$(printf '%s\n' "$response_headers" | tr -d '\r' | awk 'tolower($1) == "x-loculary-commit:" { value=$2 } END { print value }')"
            if [[ "$observed" == "$expected" ]]; then
              echo "Production alias serves expected commit $expected."
              echo "tested_sha=$observed" >> "$GITHUB_OUTPUT"
              {
                echo "## Production browser validation"
                echo "**Deployment SHA verified:** \`$observed\`"
                echo "Production alias: \`$BASE_URL\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Waiting for production deployment (attempt $attempt/60; expected $expected; observed ${observed:-no commit header})."
            sleep 5
          done
          {
            echo "## Production browser validation"
            echo "**Status:** FAILED before browser tests — production alias did not serve the expected commit."
            echo "- Expected SHA: \`$expected\`"
            echo "- Last observed SHA: \`${observed:-no commit header}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production runtime and hydration checks
        id: production_browser
        env:
          BASE_URL: https://loculary.vercel.app
          CAPTURE_SCREENSHOTS: "false"
        run: npx playwright test e2e/production-visual.spec.mjs

      - name: Summarize production browser result
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.production_browser.outcome }}
          TESTED_SHA: ${{ steps.deployment.outputs.tested_sha }}
        run: |
          {
            echo "## Production browser test result"
            echo "- Tested commit: \`${TESTED_SHA:-unverified}\`"
            echo "- Browser test outcome: \`${TEST_OUTCOME:-not run}\`"
            echo "- Screenshots: not captured by this workflow; use Production Screenshots manually."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-browser-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
