name: Production Browser Validation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-browser-validation
  cancel-in-progress: true

jobs:
  browser:
    name: Production Playwright screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect documentation-only change
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          docs_only=false

          if [[ "$EVENT_NAME" == "push" && -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            docs_only=true
            while IFS= read -r -d '' path; do
              case "$path" in
                *.md|*.mdx|*.txt|LICENSE|LICENSE.*)
                  ;;
                *)
                  docs_only=false
                  break
                  ;;
              esac
            done < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA")
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Documentation-only change: $docs_only"

      - name: Setup Node.js
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Install Playwright test runner
        if: steps.changes.outputs.docs_only != 'true'
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0

      - name: Install Playwright Chromium
        if: steps.changes.outputs.docs_only != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run production browser validation
        if: steps.changes.outputs.docs_only != 'true'
        env:
          BASE_URL: https://loculary.vercel.app
        run: npx playwright test e2e/production-visual.spec.mjs

      - name: Upload production screenshots
        if: always() && steps.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-screenshots
          path: test-results/
          if-no-files-found: warn
