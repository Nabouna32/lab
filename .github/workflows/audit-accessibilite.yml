name: Audit WCAG facultatif — axe-core

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Révision facultative ; laisser vide pour utiliser la branche choisie dans le sélecteur GitHub"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: axe-audit-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit axe-core — Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer la révision demandée
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Restaurer le cache de compilation Next.js
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-node-26.13.0-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx', 'next.config.*', 'tsconfig.json', 'postcss.config.*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-node-26.13.0-${{ hashFiles('package-lock.json') }}-

      - name: Installer Playwright Test (version stable épinglée)
        run: npm install --no-save --package-lock=false @playwright/test@1.64.1

      - name: Installer Chromium et ses dépendances système
        run: npx playwright install --with-deps chromium

      - name: Construire l'application de production
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_local_placeholder"
        run: npm run build

      - name: Exécuter l'audit axe-core facultatif
        run: npx playwright test .github/browser/material3-axe-audit.spec.mjs
        env:
          CI: "true"

      - name: Publier les preuves en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axe-audit-evidence-${{ github.run_id }}
          path: artifacts/browser/
          if-no-files-found: ignore
          retention-days: 7
