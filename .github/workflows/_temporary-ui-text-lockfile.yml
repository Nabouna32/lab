name: Générer temporairement le lockfile UI Text

on:
  push:
    branches:
      - chore/ui-text-dom-validation-final

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Generate the lockfile from pinned package versions
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit the generated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(deps): verrouiller les tests DOM UI Text"
            git push
          fi
