name: Supabase Database CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-database.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-database.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Validate CLI configuration
        run: supabase --version

      - name: Start local Supabase
        run: supabase db start

      - name: Reset local database from migrations
        run: supabase db reset

      - name: Lint local database
        run: supabase db lint --local --fail-on error

      - name: Run database tests when present
        shell: bash
        run: |
          if find supabase/tests -type f \( -name '*.sql' -o -name '*.pg' \) -print -quit 2>/dev/null | grep -q .; then
            supabase test db
          else
            echo "No pgTAP tests are present yet; migration replay and database lint remain the active CI checks."
          fi

      - name: Stop local Supabase
        if: always()
        run: supabase stop

  production-release:
    name: Finalize Supabase clean cutover
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Remove legacy remote migration history
        shell: bash
        run: |
          set -euo pipefail
          for version in \
            20260926174300 \
            20260926174401 \
            20260926185339 \
            20260926204100 \
            20260926210229 \
            20260926211909 \
            20260927002950 \
            20260927072057 \
            20260927073952 \
            20260927074002 \
            20260927074102 \
            20260927074253 \
            20260927175816 \
            20261003111925 \
            20261003112038 \
            20261003120219 \
            20261004214521 \
            20261004220957 \
            20261004231223 \
            20261005060330 \
            20261005063828 \
            20261005113540 \
            20261008203440
          do
            supabase migration repair "$version" --db-url "$SUPABASE_DB_URL" --status reverted
          done

      - name: Mark clean baseline as applied
        run: supabase migration repair 20261008195413 --db-url "$SUPABASE_DB_URL" --status applied

      - name: Verify migration history
        run: |
          set -euo pipefail
          supabase migration list --db-url "$SUPABASE_DB_URL"
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Lint production database
        run: supabase db lint --db-url "$SUPABASE_DB_URL" --fail-on error
