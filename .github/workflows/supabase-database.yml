name: Supabase Database CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-database.yml"
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-database.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Validate CLI configuration
        run: supabase --version

      - name: Start local Supabase
        run: supabase db start

      - name: Reset local database from migrations
        run: supabase db reset

      - name: Lint local database
        run: supabase db lint --local --fail-on error

      - name: Run database tests when present
        shell: bash
        run: |
          if find supabase/tests -type f \( -name '*.sql' -o -name '*.pg' \) -print -quit 2>/dev/null | grep -q .; then
            supabase test db
          else
            echo "No pgTAP tests are present yet; migration replay and database lint remain the active CI checks."
          fi

      - name: Stop local Supabase
        if: always()
        run: supabase stop

  production-release:
    name: Release Supabase migrations
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Inspect migration history
        run: supabase migration list

      - name: Preview pending migrations
        run: supabase db push --dry-run

      - name: Apply migrations
        run: supabase db push
