name: Supabase Database CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-database-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  detect-changes:
    name: Detect Supabase-related changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      validate: ${{ steps.detect.outputs.validate }}
      production: ${{ steps.detect.outputs.production }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect validation and production changes
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "validate=true" >> "$GITHUB_OUTPUT"
            echo "production=false" >> "$GITHUB_OUTPUT"
            echo "Manual runs validate the database but never release to production."
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            base="$PUSH_BEFORE_SHA"
            head="$GITHUB_SHA"
            if [[ "$base" == "0000000000000000000000000000000000000000" ]]; then
              base="$(git rev-list --max-parents=0 "$head")"
            fi
          else
            echo "Unsupported event: $EVENT_NAME" >&2
            exit 1
          fi

          changed_files="$(git diff --name-only "$base" "$head")"
          validate=false
          production=false

          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            case "$path" in
              supabase/migrations/*|supabase/tests/*|supabase/config.toml|.github/workflows/supabase-database.yml)
                validate=true
                ;;
            esac
            case "$path" in
              supabase/migrations/*|supabase/config.toml)
                production=true
                ;;
            esac
          done <<< "$changed_files"

          echo "validate=$validate" >> "$GITHUB_OUTPUT"
          echo "production=$production" >> "$GITHUB_OUTPUT"
          echo "Database validation required: $validate"
          echo "Production migration required: $production"

  run-validation:
    name: Run Supabase database validation
    needs: detect-changes
    if: needs.detect-changes.outputs.validate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0

      - name: Validate CLI configuration
        run: supabase --version

      - name: Start local Supabase
        run: supabase db start

      - name: Reset local database from migrations
        run: supabase db reset

      - name: Lint local database
        run: supabase db lint --local --fail-on error

      - name: Run database tests when present
        shell: bash
        run: |
          if find supabase/tests -type f \( -name '*.sql' -o -name '*.pg' \) -print -quit 2>/dev/null | grep -q .; then
            supabase test db
          else
            echo "No pgTAP tests are present yet; migration replay and database lint remain the active CI checks."
          fi

      - name: Stop local Supabase
        if: always()
        run: supabase stop

  validate:
    name: Validate Supabase migrations
    needs: [detect-changes, run-validation]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require validation when relevant files changed
        shell: bash
        env:
          DETECTION_RESULT: ${{ needs.detect-changes.result }}
          VALIDATION_REQUIRED: ${{ needs.detect-changes.outputs.validate }}
          VALIDATION_RESULT: ${{ needs.run-validation.result }}
        run: |
          set -euo pipefail

          if [[ "$DETECTION_RESULT" != "success" ]]; then
            echo "Change detection did not succeed; refusing to report a successful validation check." >&2
            exit 1
          fi

          if [[ "$VALIDATION_REQUIRED" == "true" ]]; then
            if [[ "$VALIDATION_RESULT" != "success" ]]; then
              echo "Supabase validation was required but ended with: $VALIDATION_RESULT" >&2
              exit 1
            fi
            echo "Supabase database validation passed."
          else
            if [[ "$VALIDATION_RESULT" != "skipped" ]]; then
              echo "Unexpected validation job result for a change set that did not require database validation: $VALIDATION_RESULT" >&2
              exit 1
            fi
            echo "No Supabase-related files changed; successful no-op validation."
          fi

  production-release:
    name: Apply Supabase migrations to production
    needs: [detect-changes, run-validation, validate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.production == 'true' && needs.run-validation.result == 'success' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: supabase-production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.120.0

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview pending migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL" --dry-run

      - name: Apply migrations
        run: supabase db push --db-url "$SUPABASE_DB_URL"

      - name: Lint production database
        run: supabase db lint --db-url "$SUPABASE_DB_URL" --fail-on error
