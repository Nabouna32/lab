name: Sonde Playwright — navigation finale

on:
  push:
    branches:
      - test/navigation-playwright-final-20261031

permissions:
  contents: read

concurrency:
  group: navigation-playwright-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navigateur:
    name: Vérification navigateur des parcours de navigation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Installer Playwright Test
        run: npm install --no-save --package-lock=false @playwright/test@1.64.1

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Construire l'application de production
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_local_placeholder"
        run: npm run build

      - name: Exécuter les tests navigateur
        run: npx playwright test
        env:
          CI: "true"

      - name: Publier les preuves en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: navigation-playwright-final-evidence-${{ github.run_id }}
          path: artifacts/browser/
          if-no-files-found: ignore
          retention-days: 7
