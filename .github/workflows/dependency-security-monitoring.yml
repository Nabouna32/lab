name: Dependency Security Monitoring

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-monitoring
  cancel-in-progress: true

jobs:
  npm-audit:
    name: npm audit monitoring
    runs-on: [self-hosted, Windows, X64, loculary-ci]
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: false

      - name: Clean workspace while preserving local caches
        shell: pwsh
        run: git clean -ffdx -e node_modules -e .next

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Audit locked dependency graph
        shell: pwsh
        run: node .github/scripts/run-npm-audit.mjs
