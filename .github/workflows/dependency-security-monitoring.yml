name: Dependency Security Monitoring

on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    name: npm audit monitoring
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Audit locked dependency graph
        shell: bash
        run: |
          if npm audit --audit-level=high --json > npm-audit.json; then
            audit_status=0
          else
            audit_status=$?
          fi

          if node .github/scripts/report-npm-audit.mjs npm-audit.json; then
            report_status=0
          else
            report_status=$?
          fi

          # Preserve the audit's failure even when the report was generated successfully.
          if [ "$audit_status" -ne 0 ]; then
            exit "$audit_status"
          fi

          # A broken reporter must also fail the job instead of hiding missing diagnostics.
          exit "$report_status"
