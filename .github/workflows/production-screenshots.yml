name: Production Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    name: Capture production screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run this workflow from main so the screenshots can be matched to production."
            exit 1
          fi

      - name: Wait for production alias to serve this commit
        id: deployment
        shell: bash
        env:
          HEAD_SHA: ${{ github.sha }}
          BASE_URL: https://loculary.vercel.app/fr
        run: |
          expected="$HEAD_SHA"
          observed=""
          for attempt in $(seq 1 60); do
            response_headers="$(curl -fsSL -D - -o /dev/null --max-time 5 "$BASE_URL" 2>/dev/null || true)"
            observed="$(printf '%s\n' "$response_headers" | tr -d '\r' | awk 'tolower($1) == "x-loculary-commit:" { value=$2 } END { print value }')"
            if [[ "$observed" == "$expected" ]]; then
              echo "Production alias serves expected commit $expected."
              echo "tested_sha=$observed" >> "$GITHUB_OUTPUT"
              {
                echo "## Production screenshots"
                echo "**Deployment SHA verified:** \`$observed\`"
                echo "Production alias: \`$BASE_URL\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Waiting for production deployment (attempt $attempt/60; expected $expected; observed ${observed:-no commit header})."
            sleep 5
          done
          {
            echo "## Production screenshots"
            echo "**Status:** FAILED before capture — production alias did not serve the expected commit."
            echo "- Expected SHA: \`$expected\`"
            echo "- Last observed SHA: \`${observed:-no commit header}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture production screenshots
        id: capture
        env:
          BASE_URL: https://loculary.vercel.app
          CAPTURE_SCREENSHOTS: "true"
        run: npx playwright test e2e/production-visual.spec.mjs

      - name: Summarize screenshot result
        if: always()
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          TESTED_SHA: ${{ steps.deployment.outputs.tested_sha }}
        run: |
          {
            echo "## Production screenshot result"
            echo "- Tested commit: \`${TESTED_SHA:-unverified}\`"
            echo "- Capture outcome: \`${CAPTURE_OUTCOME:-not run}\`"
            echo "- Viewports: desktop, mobile 390px, narrow mobile 320px, tablet, percentage tool mobile."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload production screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-screenshots
          path: test-results/
          if-no-files-found: warn
          retention-days: 7
