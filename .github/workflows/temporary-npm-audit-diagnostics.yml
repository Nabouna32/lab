name: Temporary npm audit diagnostics

on:
  push:
    branches:
      - audit/diagnostic-main-lockfile-2026-10-19
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    name: Full and production dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Install locked dependencies
        run: npm ci

      - name: Capture full dependency audit
        shell: bash
        run: |
          set +e
          npm audit --audit-level=high --json > npm-audit-full.json
          audit_status=$?
          node .github/scripts/report-npm-audit.mjs npm-audit-full.json
          report_status=$?
          echo "FULL_AUDIT_EXIT_CODE=$audit_status"
          echo "FULL_REPORT_EXIT_CODE=$report_status"
          test "$report_status" -eq 0

      - name: Capture production-only dependency audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high --json > npm-audit-production.json
          audit_status=$?
          node .github/scripts/report-npm-audit.mjs npm-audit-production.json
          report_status=$?
          echo "PRODUCTION_AUDIT_EXIT_CODE=$audit_status"
          echo "PRODUCTION_REPORT_EXIT_CODE=$report_status"
          test "$report_status" -eq 0
