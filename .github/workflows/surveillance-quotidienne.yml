name: Surveillance quotidienne

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: surveillance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  surveillance:
    name: Audit npm et parcours Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout de la branche sélectionnée
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installer les dépendances du projet
        run: npm ci

      - name: Installer Playwright Test (version épinglée)
        run: npm install --no-save --package-lock=false --ignore-scripts @playwright/test@1.64.0

      - name: Audit complet du graphe npm
        run: node .github/scripts/run-npm-audit.mjs

      - name: Compiler l'application
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_local_placeholder"
        run: npm run build

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      - name: Tester les parcours critiques avec Playwright
        run: npx playwright test

      - name: Publier le rapport JSON compact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surveillance-playwright-report
          path: artifacts/browser/report.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Publier les preuves uniquement en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surveillance-playwright-evidence
          path: artifacts/browser/test-results/
          if-no-files-found: ignore
          retention-days: 3
