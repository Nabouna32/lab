name: Validation temporaire pgTAP

on:
  push:
    branches:
      - ci/supabase-pgtap-validation

permissions:
  contents: read

jobs:
  pgTAP:
    name: PostgreSQL local — pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Install Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.84.2

      - name: Start minimal local Supabase stack
        run: supabase start -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Run pgTAP database tests
        run: supabase test db --local

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup || true
