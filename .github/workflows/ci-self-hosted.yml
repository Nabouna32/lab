name: Self-hosted CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-hosted-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Local-cache validation
    # Configure the runner with the custom "loculary-ci" label.
    # This workflow is manual-only so an offline PC cannot block pull-request checks.
    runs-on: [self-hosted, loculary-ci]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          # Intentionally no setup-node cache: npm's cache stays on this runner's disk.

      - name: Prepare persistent dependencies
        id: dependencies
        run: node .github/scripts/dependency-cache.mjs prepare

      - name: Install dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: npm ci

      - name: Persist dependencies
        if: success() && steps.dependencies.outputs.cache-hit != 'true'
        run: node .github/scripts/dependency-cache.mjs save

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Restore local Next.js build cache
        run: node .github/scripts/next-local-cache.mjs restore

      - name: Build
        run: npm run build

      - name: Persist local Next.js build cache
        if: success()
        run: node .github/scripts/next-local-cache.mjs save
