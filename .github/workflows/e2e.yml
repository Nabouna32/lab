name: Browser E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.63.0

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Next.js
        run: npm run start > /tmp/loculary-next.log 2>&1 &

      - name: Wait for Next.js
        run: npx --yes wait-on@9.0.1 http://127.0.0.1:3000/fr

      - name: Run browser smoke tests
        run: npx playwright test e2e/smoke.spec.mjs e2e/uuid.spec.mjs e2e/video-bitrate.spec.mjs e2e/unix-timestamp.spec.mjs e2e/hash-generator.spec.mjs e2e/jwt-decoder.spec.mjs e2e/regex-tester.spec.mjs e2e/password-generator.spec.mjs e2e/color-converter.spec.mjs e2e/color-palette-generator.spec.mjs

      - name: Dump Next.js server log on failure
        if: failure()
        run: cat /tmp/loculary-next.log

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
            /tmp/loculary-next.log
          if-no-files-found: ignore
