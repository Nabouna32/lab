name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Node.js 24.21.0
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Detect lightweight and dependency changes
        id: changes
        if: github.event_name == 'pull_request'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/detect-ci-changes.mjs

      - name: Setup Node.js
        if: github.event_name != 'pull_request' || steps.changes.outputs.lightweight_only != 'true' || steps.changes.outputs.governance_changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Checkout dependency baseline
        if: github.event_name == 'pull_request' && steps.changes.outputs.dependencies_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: dependency-baseline
          fetch-depth: 1
          persist-credentials: false

      - name: Compare high-severity dependency advisories
        if: github.event_name == 'pull_request' && steps.changes.outputs.dependencies_changed == 'true'
        run: node .github/scripts/dependency-audit-diff.mjs dependency-baseline

      - name: Classify dependency verification scope
        id: dependency_scope
        if: github.event_name == 'pull_request' && steps.changes.outputs.dependencies_changed == 'true'
        env:
          DEPENDENCY_MANIFESTS_ONLY: ${{ steps.changes.outputs.dependency_manifests_only }}
        run: |
          node .github/scripts/classify-dependency-diff.mjs dependency-baseline/package.json package.json dependency-baseline/package-lock.json package-lock.json "$DEPENDENCY_MANIFESTS_ONLY"

      - name: Exercise CI tooling tests
        if: github.event_name == 'pull_request' && steps.changes.outputs.governance_changed == 'true'
        run: node --test .github/scripts/classify-ci-changes.test.mjs .github/scripts/detect-ci-changes.test.mjs .github/scripts/dependency-audit-diff.test.mjs .github/scripts/classify-dependency-diff.test.mjs

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.lightweight_only != 'true'
        run: npm ci

      - name: Lint
        if: github.event_name != 'pull_request' || (steps.changes.outputs.lightweight_only != 'true' && steps.dependency_scope.outputs.scope != 'lint_only')
        run: npm run lint

      - name: Typecheck
        if: github.event_name != 'pull_request' || (steps.changes.outputs.lightweight_only != 'true' && steps.dependency_scope.outputs.scope != 'lint_only')
        run: npm run typecheck

      - name: Unit tests
        if: github.event_name != 'pull_request' || (steps.changes.outputs.lightweight_only != 'true' && steps.dependency_scope.outputs.scope != 'lint_only')
        run: npm test

      - name: Production build
        if: github.event_name != 'pull_request' || (steps.changes.outputs.lightweight_only != 'true' && steps.dependency_scope.outputs.scope != 'lint_only')
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_local_placeholder"
        run: npm run build

      - name: Setup Deno for changed Edge Functions
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.supabase_changed == 'true'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.1.4

      - name: Validate Supabase Edge Functions
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.supabase_changed == 'true'
        run: |
          set -euo pipefail
          for function in account-delete admin-user-sessions admin-user-suspension; do
            (cd "supabase/functions/$function" && deno check --frozen index.ts)
          done

      - name: Remove dependency baseline checkout
        if: always() && github.event_name == 'pull_request' && steps.changes.outputs.dependencies_changed == 'true'
        run: rm -rf dependency-baseline

      - name: Confirm applicable checks passed
        if: success()
        run: echo "All applicable CI checks passed."

  npm-audit:
    name: Scheduled npm security audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Audit locked dependency graph
        run: node .github/scripts/run-npm-audit.mjs
