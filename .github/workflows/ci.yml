name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Classify changes and validate governance
    # Never execute code from a fork on the personal self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, loculary-ci]
    timeout-minutes: 15
    outputs:
      lightweight_only: ${{ steps.changes.outputs.lightweight_only }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - name: Clean workspace while preserving local caches
        shell: pwsh
        run: git clean -ffdx -e node_modules -e .next

      - name: Detect lightweight and dependency changes
        id: changes
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/detect-ci-changes.mjs

      # The GitHub Dependency Review API requires a feature not enabled for this private repo.
      # Compare npm audit findings against the PR base instead of silently skipping dependency checks.
      - name: Checkout dependency baseline
        if: github.event_name == 'pull_request' && steps.changes.outputs.dependencies_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: dependency-baseline
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - name: Setup Node.js
        if: steps.changes.outputs.lightweight_only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          # setup-node reuses the runner's local tool cache; no npm/GitHub cache is enabled.

      - name: Compare high-severity dependency advisories
        if: github.event_name == 'pull_request' && steps.changes.outputs.dependencies_changed == 'true'
        shell: pwsh
        run: node .github/scripts/dependency-audit-diff.mjs dependency-baseline

      - name: Remove dependency baseline checkout
        if: github.event_name == 'pull_request' && steps.changes.outputs.dependencies_changed == 'true'
        shell: pwsh
        run: Remove-Item -Recurse -Force dependency-baseline

      - name: Exercise CI tooling tests
        if: steps.changes.outputs.governance_changed == 'true'
        shell: pwsh
        run: node --test .github/scripts/classify-ci-changes.test.mjs .github/scripts/detect-ci-changes.test.mjs .github/scripts/dependency-audit-diff.test.mjs

  validate:
    name: Quality, production build and Playwright
    needs: prepare
    if: needs.prepare.outputs.lightweight_only != 'true'
    runs-on: [self-hosted, Windows, X64, loculary-ci]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          clean: false

      - name: Clean workspace while preserving local caches
        shell: pwsh
        run: git clean -ffdx -e node_modules -e .next

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Prepare persistent local dependencies
        id: dependencies
        shell: pwsh
        run: node .github/scripts/dependency-cache.mjs prepare

      - name: Install dependencies only on cache miss
        if: steps.dependencies.outputs.cache-hit != 'true'
        shell: pwsh
        run: npm ci

      - name: Persist dependencies locally
        if: success() && steps.dependencies.outputs.cache-hit != 'true'
        shell: pwsh
        run: node .github/scripts/dependency-cache.mjs save

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_local_e2e_placeholder"
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install chromium

      - name: Run browser smoke tests and collect visual diagnostics
        env:
          CI: "true"
        run: npm run e2e

      - name: Upload browser reports and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-observation-${{ github.run_number }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
