name: CI

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node.js 24.21.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify PR base is current
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin main --no-tags
          current_main_sha="$(git rev-parse FETCH_HEAD)"
          if [[ "$EVENT_BASE_SHA" != "$current_main_sha" ]]; then
            echo "::error::main advanced after this PR event. Update the PR branch against current main and rerun CI."
            echo "PR event base: $EVENT_BASE_SHA"
            echo "Current main:  $current_main_sha"
            exit 1
          fi
          echo "PR base matches current main: $current_main_sha"

      - name: Detect documentation-only change
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docs_only=false

          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "push" ]]; then
            if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
              docs_only=true
              while IFS= read -r -d '' path; do
                case "$path" in
                  *.md|*.mdx|*.txt|LICENSE|LICENSE.*)
                    ;;
                  *)
                    docs_only=false
                    break
                    ;;
                esac
              done < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA")
            fi
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Documentation-only change: $docs_only"

      - name: Setup Node.js
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Validate workflow contracts
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run validate:workflows

      - name: Lint
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run typecheck

      - name: Test
        if: steps.changes.outputs.docs_only != 'true'
        run: npm test

      - name: Build
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run build

