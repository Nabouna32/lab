name: Validation des contributions

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - closed
  workflow_dispatch:
    inputs:
      scope:
        description: "Portée des validations à exécuter"
        required: true
        default: full
        type: choice
        options:
          - full
          - build-only

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Détection des changements et contrôles préalables
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lightweight_only: ${{ steps.changes.outputs.lightweight_only }}
      dependencies_changed: ${{ steps.changes.outputs.dependencies_changed }}
      governance_changed: ${{ steps.changes.outputs.governance_changed }}
      androidx_provenance_changed: ${{ steps.changes.outputs.androidx_provenance_changed }}
      supabase_functions_changed: ${{ steps.changes.outputs.supabase_functions_changed }}
      supabase_database_changed: ${{ steps.changes.outputs.supabase_database_changed }}
      dependency_manifests_only: ${{ steps.changes.outputs.dependency_manifests_only }}
      dependency_scope: ${{ steps.dependency_scope.outputs.scope }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Detect lightweight and dependency changes
        id: changes
        if: github.event_name == 'pull_request'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/detect-ci-changes.mjs

      - name: Setup Node.js
        if: github.event_name != 'pull_request' || steps.changes.outputs.lightweight_only != 'true' || steps.changes.outputs.governance_changed == 'true' || steps.changes.outputs.androidx_provenance_changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Checkout dependency baseline
        if: github.event_name == 'pull_request' && steps.changes.outputs.dependencies_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: dependency-baseline
          fetch-depth: 1
          persist-credentials: false

      - name: Compare high-severity dependency advisories
        if: github.event_name == 'pull_request' && steps.changes.outputs.dependencies_changed == 'true'
        run: node .github/scripts/dependency-audit-diff.mjs dependency-baseline

      - name: Classify dependency verification scope
        id: dependency_scope
        if: github.event_name == 'pull_request' && steps.changes.outputs.dependencies_changed == 'true'
        env:
          DEPENDENCY_MANIFESTS_ONLY: ${{ steps.changes.outputs.dependency_manifests_only }}
        run: |
          node .github/scripts/classify-dependency-diff.mjs dependency-baseline/package.json package.json dependency-baseline/package-lock.json package-lock.json "$DEPENDENCY_MANIFESTS_ONLY"

      - name: Remove dependency baseline checkout
        if: always() && github.event_name == 'pull_request' && steps.changes.outputs.dependencies_changed == 'true'
        run: rm -rf dependency-baseline

      - name: Setup Java for binary API inspection
        if: github.event_name == 'pull_request' && steps.changes.outputs.androidx_provenance_changed == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Material 3 source archive provenance
        if: github.event_name == 'pull_request' && steps.changes.outputs.androidx_provenance_changed == 'true'
        run: node .github/scripts/verify-androidx-source-archive.mjs docs/material3/catalog/baselines/material3-1.4.0.json

      - name: Audit Compose UI, Foundation, UI Text and Foundation Layout publications
        if: github.event_name == 'pull_request' && steps.changes.outputs.androidx_provenance_changed == 'true'
        run: node .github/scripts/audit-compose-submodule-publications.mjs /tmp/compose-publications-1.12.1.json

      - name: Upload Compose submodule publication audit
        if: github.event_name == 'pull_request' && steps.changes.outputs.androidx_provenance_changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-publications-1.12.1
          path: |
            /tmp/compose-publications-1.12.1.json
            /tmp/compose-source-archives/
          if-no-files-found: error
          retention-days: 7

      - name: Retrieve and verify all four Material 3 1.4.0 publication artifacts
        if: github.event_name == 'pull_request' && steps.changes.outputs.androidx_provenance_changed == 'true'
        run: node .github/scripts/fetch-material3-release-artifacts.mjs /tmp/material3-1.4.0-release-artifacts

      - name: Verify published Material 3 sources against the AndroidX release commit
        if: github.event_name == 'pull_request' && steps.changes.outputs.androidx_provenance_changed == 'true'
        run: python3 .github/scripts/verify-material3-source-commit.py /tmp/material3-1.4.0-release-artifacts/material3-android-1.4.0-sources.jar /tmp/material3-1.4.0-release-artifacts/material3-android-1.4.0-source-commit-verification.json

      - name: Inspect Material 3 Android AAR against published sources
        if: github.event_name == 'pull_request' && steps.changes.outputs.androidx_provenance_changed == 'true'
        run: python3 .github/scripts/inspect-material3-android-aar.py /tmp/material3-1.4.0-release-artifacts docs/material3/catalog/baselines/material3-android-1.4.0-api-inventory.json

      - name: Upload verified Material 3 1.4.0 publication artifacts
        if: github.event_name == 'pull_request' && steps.changes.outputs.androidx_provenance_changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: material3-1.4.0-published-artifacts
          path: |
            /tmp/material3-1.4.0-release-artifacts/
            docs/material3/catalog/baselines/material3-android-1.4.0-api-inventory.json
          if-no-files-found: error
          retention-days: 7

      - name: Exercise CI tooling tests
        if: github.event_name == 'pull_request' && steps.changes.outputs.governance_changed == 'true'
        run: |
          node --test .github/scripts/*.test.mjs
          python3 .github/scripts/test_inspect_material3_android_aar.py
          python3 .github/scripts/test_verify_material3_source_commit.py
          python3 .github/scripts/test_verify_compose_source_archive_alignment.py

      - name: Discover official AndroidX Compose release refs
        if: github.event_name == 'pull_request' && steps.changes.outputs.androidx_provenance_changed == 'true'
        run: |
          git ls-remote --heads --tags https://android.googlesource.com/platform/frameworks/support \
            'refs/heads/*compose*' \
            'refs/tags/*compose*1.12.1*' \
            > /tmp/androidx-compose-release-refs.txt
          test -s /tmp/androidx-compose-release-refs.txt
          cat /tmp/androidx-compose-release-refs.txt

      - name: Inspect official Compose 1.12.1 release API provenance
        if: github.event_name == 'pull_request' && steps.changes.outputs.androidx_provenance_changed == 'true'
        run: node .github/scripts/inspect-compose-release-api-provenance.mjs /tmp/compose-release-api-provenance /tmp/androidx-compose-release-refs.txt docs/material3/catalog/baselines/compose-p0-1.12.1-api-provenance.json

      - name: Verify Compose 1.12.1 source archives against the release commit
        if: github.event_name == 'pull_request' && steps.changes.outputs.androidx_provenance_changed == 'true'
        run: |
          python3 .github/scripts/verify-compose-source-archive-alignment.py \
            --archives-dir /tmp/compose-source-archives \
            --publication-report /tmp/compose-publications-1.12.1.json \
            --provenance-manifest docs/material3/catalog/baselines/compose-p0-1.12.1-api-provenance.json \
            --output /tmp/compose-source-alignment-1.12.1.json

      - name: Upload Compose 1.12.1 source alignment report
        if: always() && github.event_name == 'pull_request' && steps.changes.outputs.androidx_provenance_changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-source-alignment-1.12.1
          path: /tmp/compose-source-alignment-1.12.1.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Compose 1.12.1 release API provenance
        if: github.event_name == 'pull_request' && steps.changes.outputs.androidx_provenance_changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-release-api-provenance-1.12.1
          path: /tmp/compose-release-api-provenance/
          if-no-files-found: error
          retention-days: 7

      - name: Verify Material 3 Android source/AAR inventory reproducibility
        if: github.event_name == 'pull_request' && steps.changes.outputs.androidx_provenance_changed == 'true'
        run: git diff --exit-code -- docs/material3/catalog/baselines/material3-android-1.4.0-api-inventory.json

      - name: Verify Material Components Views source archive provenance
        if: github.event_name == 'pull_request' && steps.changes.outputs.androidx_provenance_changed == 'true'
        run: node .github/scripts/inspect-material-components-source-archive.mjs docs/material3/catalog/baselines/material-components-views-1.14.0.json

        

  quality:
    name: Lint, vérification TypeScript et tests unitaires
    needs: prepare
    if: >-
      ${{ github.event.action != 'closed' &&
          always() &&
          (needs.prepare.result == 'success' || github.event_name == 'pull_request') &&
          (github.event_name != 'pull_request' || needs.prepare.outputs.lightweight_only != 'true') &&
          (github.event_name != 'workflow_dispatch' || inputs.scope == 'full') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - parallel:
          - name: Lint
            run: npm run lint

          - name: Typecheck
            if: github.event_name != 'pull_request' || needs.prepare.outputs.dependency_scope != 'lint_only'
            run: npm run typecheck

          - name: Unit tests
            if: github.event_name != 'pull_request' || needs.prepare.outputs.dependency_scope != 'lint_only'
            run: npm test

  build:
    name: Construction de l'application de production
    needs: prepare
    if: >-
      ${{ always() &&
          (needs.prepare.result == 'success' || github.event_name == 'pull_request') &&
          (github.event_name != 'pull_request' ||
            (needs.prepare.outputs.lightweight_only != 'true' &&
             needs.prepare.outputs.dependency_scope != 'lint_only')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restaurer le cache de compilation Next.js
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-node-26.13.0-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.js', 'src/**/*.jsx', 'src/**/*.ts', 'src/**/*.tsx', 'next.config.*', 'tsconfig.json', 'postcss.config.*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-node-26.13.0-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_local_placeholder"
        run: npm run build

  supabase-functions:
    name: Vérification des fonctions Edge Supabase (Deno)
    needs: prepare
    if: >-
      ${{ github.event.action != 'closed' &&
          needs.prepare.result == 'success' &&
          ((github.event_name == 'workflow_dispatch' && inputs.scope == 'full') ||
           (github.event_name != 'workflow_dispatch' && needs.prepare.outputs.supabase_functions_changed == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Installer Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.1.4

      - name: Découvrir et vérifier toutes les Edge Functions
        run: |
          set -euo pipefail
          mapfile -t function_entries < <(find supabase/functions -mindepth 2 -maxdepth 2 -type f -name index.ts -print | sort)
          if [ "${#function_entries[@]}" -eq 0 ]; then
            echo "No Supabase Edge Functions found."
            exit 0
          fi
          for function_entry in "${function_entries[@]}"; do
            function_dir="$(dirname "$function_entry")"
            echo "::group::Deno check $function_dir"
            (cd "$function_dir" && deno check --frozen index.ts)
            echo "::endgroup::"
          done

  supabase-database:
    name: Validation de la base Supabase — migrations, tests pgTAP et analyse SQL
    needs: prepare
    if: >-
      ${{ github.event.action != 'closed' &&
          needs.prepare.result == 'success' &&
          ((github.event_name == 'workflow_dispatch' && inputs.scope == 'full') ||
           (github.event_name != 'workflow_dispatch' && needs.prepare.outputs.supabase_database_changed == 'true')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Installer la CLI Supabase épinglée
        uses: supabase/setup-cli@d239d1052f6f024a8d746d7e5aeddead63b9cb53 # v3
        with:
          version: 2.122.0

      - name: Démarrer la base locale minimale et appliquer toutes les migrations
        id: db_start
        run: supabase db start

      - name: Exécuter tous les tests pgTAP
        if: steps.db_start.outcome == 'success'
        run: supabase test db --local

      - name: Analyser le schéma PostgreSQL
        if: always() && steps.db_start.outcome == 'success'
        run: supabase db lint --local --fail-on error

      - name: Arrêter PostgreSQL local
        if: always() && steps.db_start.outcome != 'skipped'
        run: supabase stop


  ci:
    name: Vérification finale des contrôles applicables
    needs: [prepare, quality, build, supabase-functions, supabase-database]
    if: always() && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Contrôle de gouvernance des PR
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR_LOGIN: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: node .github/scripts/check-pr-governance.mjs

      - name: Confirm all applicable checks passed
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SUPABASE_FUNCTIONS_RESULT: ${{ needs.supabase-functions.result }}
          SUPABASE_DATABASE_RESULT: ${{ needs.supabase-database.result }}
        run: |
          set -euo pipefail
          for result in "$PREPARE_RESULT" "$QUALITY_RESULT" "$BUILD_RESULT" "$SUPABASE_FUNCTIONS_RESULT" "$SUPABASE_DATABASE_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "A required CI job did not pass: $result" >&2; exit 1 ;;
            esac
          done
          echo "All applicable CI checks passed."

  recheck-blocked-prs:
    name: Réévaluation de la PR prioritaire après fermeture
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted main workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Réévaluer uniquement le contrôle de gouvernance échoué
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/recheck-pr-governance.mjs
