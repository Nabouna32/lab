name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Préparation CI
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      lightweight_only: ${{ steps.changes.outputs.lightweight_only }}
      dependencies_changed: ${{ steps.changes.outputs.dependencies_changed }}
      governance_changed: ${{ steps.changes.outputs.governance_changed }}
      supabase_changed: ${{ steps.changes.outputs.supabase_changed }}
      dependency_manifests_only: ${{ steps.changes.outputs.dependency_manifests_only }}
      dependency_scope: ${{ steps.dependency_scope.outputs.scope }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Detect lightweight and dependency changes
        id: changes
        if: github.event_name == 'pull_request'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/detect-ci-changes.mjs

      - name: Setup Node.js
        if: github.event_name != 'pull_request' || steps.changes.outputs.lightweight_only != 'true' || steps.changes.outputs.governance_changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Checkout dependency baseline
        if: github.event_name == 'pull_request' && steps.changes.outputs.dependencies_changed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: dependency-baseline
          fetch-depth: 1
          persist-credentials: false

      - name: Compare high-severity dependency advisories
        if: github.event_name == 'pull_request' && steps.changes.outputs.dependencies_changed == 'true'
        run: node .github/scripts/dependency-audit-diff.mjs dependency-baseline

      - name: Classify dependency verification scope
        id: dependency_scope
        if: github.event_name == 'pull_request' && steps.changes.outputs.dependencies_changed == 'true'
        env:
          DEPENDENCY_MANIFESTS_ONLY: ${{ steps.changes.outputs.dependency_manifests_only }}
        run: |
          node .github/scripts/classify-dependency-diff.mjs dependency-baseline/package.json package.json dependency-baseline/package-lock.json package-lock.json "$DEPENDENCY_MANIFESTS_ONLY"

      - name: Remove dependency baseline checkout
        if: always() && github.event_name == 'pull_request' && steps.changes.outputs.dependencies_changed == 'true'
        run: rm -rf dependency-baseline

      - name: Setup Java for binary API inspection
        if: github.event_name == 'pull_request' && steps.changes.outputs.governance_changed == 'true'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate provisional Material Components Views API inventory
        if: github.event_name == 'pull_request' && steps.changes.outputs.governance_changed == 'true'
        run: |
          node .github/scripts/inventory-material-components-api.mjs docs/material3/catalog/baselines/material-components-views-1.14.0.json docs/material3/catalog/baselines/material-components-views-1.14.0-api-inventory.json

      - name: Upload generated MDC API inventory
        if: github.event_name == 'pull_request' && steps.changes.outputs.governance_changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: material-components-views-1.14.0-api-inventory
          path: docs/material3/catalog/baselines/material-components-views-1.14.0-api-inventory.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify generated MDC API inventory reproducibility
        if: github.event_name == 'pull_request' && steps.changes.outputs.governance_changed == 'true'
        run: git diff --exit-code -- docs/material3/catalog/baselines/material-components-views-1.14.0-api-inventory.json

      - name: Verify Material 3 source archive provenance
        if: github.event_name == 'pull_request' && steps.changes.outputs.governance_changed == 'true'
        run: node .github/scripts/verify-androidx-source-archive.mjs docs/material3/catalog/baselines/material3-1.4.0.json

      - name: Audit Compose UI, Foundation, UI Text and Foundation Layout publications
        if: github.event_name == 'pull_request' && steps.changes.outputs.governance_changed == 'true'
        run: node .github/scripts/audit-compose-submodule-publications.mjs /tmp/compose-publications-1.12.1.json

      - name: Upload Compose submodule publication audit
        if: github.event_name == 'pull_request' && steps.changes.outputs.governance_changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compose-publications-1.12.1
          path: /tmp/compose-publications-1.12.1.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify Compose 1.12.1 sources and API dumps against the official release branch
        if: github.event_name == 'pull_request' && steps.changes.outputs.governance_changed == 'true'
        run: python3 .github/scripts/audit_androidx_compose_release.py /tmp/compose-1.12.1-release-provenance

      - name: Upload Compose 1.12.1 release provenance and API dumps
        if: github.event_name == 'pull_request' && steps.changes.outputs.governance_changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: compose-1.12.1-release-provenance
          path: /tmp/compose-1.12.1-release-provenance/
          if-no-files-found: error
          retention-days: 7

      - name: Retrieve and verify all four Material 3 1.4.0 publication artifacts
        if: github.event_name == 'pull_request' && steps.changes.outputs.governance_changed == 'true'
        run: node .github/scripts/fetch-material3-release-artifacts.mjs /tmp/material3-1.4.0-release-artifacts

      - name: Verify published Material 3 sources against the AndroidX release commit
        if: github.event_name == 'pull_request' && steps.changes.outputs.governance_changed == 'true'
        run: python3 .github/scripts/verify-material3-source-commit.py /tmp/material3-1.4.0-release-artifacts/material3-android-1.4.0-sources.jar /tmp/material3-1.4.0-release-artifacts/material3-android-1.4.0-source-commit-verification.json

      - name: Inspect Material 3 Android AAR against published sources
        if: github.event_name == 'pull_request' && steps.changes.outputs.governance_changed == 'true'
        run: python3 .github/scripts/inspect-material3-android-aar.py /tmp/material3-1.4.0-release-artifacts docs/material3/catalog/baselines/material3-android-1.4.0-api-inventory.json

      - name: Upload verified Material 3 1.4.0 publication artifacts
        if: github.event_name == 'pull_request' && steps.changes.outputs.governance_changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: material3-1.4.0-published-artifacts
          path: |
            /tmp/material3-1.4.0-release-artifacts/
            docs/material3/catalog/baselines/material3-android-1.4.0-api-inventory.json
          if-no-files-found: error
          retention-days: 7

      - name: Test AndroidX Compose release provenance tooling
        if: github.event_name == 'pull_request' && steps.changes.outputs.governance_changed == 'true'
        run: python3 .github/scripts/test_androidx_compose_release.py

      - name: Exercise CI tooling tests
        if: github.event_name == 'pull_request' && steps.changes.outputs.governance_changed == 'true'
        run: |
          node --test .github/scripts/*.test.mjs
          python3 .github/scripts/test_inventory_material_components_api.py
          python3 .github/scripts/test_inspect_material3_android_aar.py
          python3 .github/scripts/test_verify_material3_source_commit.py

      - name: Verify Material 3 Android source/AAR inventory reproducibility
        if: github.event_name == 'pull_request' && steps.changes.outputs.governance_changed == 'true'
        run: git diff --exit-code -- docs/material3/catalog/baselines/material3-android-1.4.0-api-inventory.json

      - name: Verify Material Components Views source archive provenance
        if: github.event_name == 'pull_request' && steps.changes.outputs.governance_changed == 'true'
        run: node .github/scripts/inspect-material-components-source-archive.mjs docs/material3/catalog/baselines/material-components-views-1.14.0.json

        

  quality:
    name: Qualité du code
    needs: prepare
    if: >-
      ${{ always() &&
          github.event_name != 'schedule' &&
          (needs.prepare.result == 'success' || github.event_name == 'pull_request') &&
          (github.event_name != 'pull_request' || needs.prepare.outputs.lightweight_only != 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - parallel:
          - name: Lint
            run: npm run lint

          - name: Typecheck
            if: github.event_name != 'pull_request' || needs.prepare.outputs.dependency_scope != 'lint_only'
            run: npm run typecheck

          - name: Unit tests
            if: github.event_name != 'pull_request' || needs.prepare.outputs.dependency_scope != 'lint_only'
            run: npm test

  build:
    name: Compilation de production
    needs: prepare
    if: >-
      ${{ always() &&
          github.event_name != 'schedule' &&
          (needs.prepare.result == 'success' || github.event_name == 'pull_request') &&
          (github.event_name != 'pull_request' ||
            (needs.prepare.outputs.lightweight_only != 'true' &&
             needs.prepare.outputs.dependency_scope != 'lint_only')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_local_placeholder"
        run: npm run build

  supabase:
    name: Vérification Supabase
    needs: prepare
    if: >-
      ${{ needs.prepare.result == 'success' &&
          github.event_name != 'schedule' &&
          (github.event_name == 'workflow_dispatch' || needs.prepare.outputs.supabase_changed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.1.4

      - name: Validate Supabase Edge Functions
        run: |
          set -euo pipefail
          for function in account-delete admin-user-sessions admin-user-suspension; do
            (cd "supabase/functions/$function" && deno check --frozen index.ts)
          done

  ci:
    name: Node.js 24.21.0
    needs: [prepare, quality, build, supabase, npm-audit]
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm all applicable checks passed
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SUPABASE_RESULT: ${{ needs.supabase.result }}
          NPM_AUDIT_RESULT: ${{ needs.npm-audit.result }}
        run: |
          set -euo pipefail
          case "$NPM_AUDIT_RESULT" in
            success) ;;
            *) echo "The npm audit job must succeed: $NPM_AUDIT_RESULT" >&2; exit 1 ;;
          esac
          for result in "$PREPARE_RESULT" "$QUALITY_RESULT" "$BUILD_RESULT" "$SUPABASE_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) echo "A required CI job did not pass: $result" >&2; exit 1 ;;
            esac
          done
          echo "All applicable CI checks passed."

  npm-audit:
    name: Audit de sécurité npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Audit locked dependency graph
        run: node .github/scripts/run-npm-audit.mjs
