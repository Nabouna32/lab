name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node.js 24.21.0
    # Never execute code from a fork on the personal self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, loculary-ci]
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Detect lightweight and dependency changes
        id: changes
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/detect-ci-changes.mjs

      - name: Review dependency changes
        if: github.event_name == 'pull_request' && steps.changes.outputs.dependencies_changed == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development

      - name: Setup Node.js
        if: steps.changes.outputs.lightweight_only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          # setup-node reuses the runner's local tool cache; no npm/GitHub cache is enabled.

      - name: Exercise CI tooling tests
        if: steps.changes.outputs.governance_changed == 'true'
        shell: pwsh
        run: node --test .github/scripts/*.test.mjs

      - name: Prepare persistent local dependencies
        if: steps.changes.outputs.lightweight_only != 'true'
        id: dependencies
        shell: pwsh
        run: node .github/scripts/dependency-cache.mjs prepare

      - name: Install dependencies only on cache miss
        if: steps.changes.outputs.lightweight_only != 'true' && steps.dependencies.outputs.cache-hit != 'true'
        shell: pwsh
        run: npm ci

      - name: Persist dependencies locally
        if: success() && steps.changes.outputs.lightweight_only != 'true' && steps.dependencies.outputs.cache-hit != 'true'
        shell: pwsh
        run: node .github/scripts/dependency-cache.mjs save

      - name: Lint
        if: steps.changes.outputs.lightweight_only != 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.changes.outputs.lightweight_only != 'true'
        run: npm run typecheck

      - name: Test
        if: steps.changes.outputs.lightweight_only != 'true'
        run: npm test

      - name: Restore local Next.js build cache
        if: steps.changes.outputs.lightweight_only != 'true'
        shell: pwsh
        run: node .github/scripts/next-local-cache.mjs restore

      - name: Build
        if: steps.changes.outputs.lightweight_only != 'true'
        run: npm run build

      - name: Persist local Next.js build cache
        if: success() && steps.changes.outputs.lightweight_only != 'true'
        shell: pwsh
        run: node .github/scripts/next-local-cache.mjs save
