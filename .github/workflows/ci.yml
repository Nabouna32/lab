name: CI

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect CI scope
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect documentation-only changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          docs_only=false

          if [[ "$EVENT_NAME" == "pull_request" && -n "$BASE_SHA" && -n "$HEAD_SHA" ]]; then
            docs_only=true
            while IFS= read -r -d '' path; do
              case "$path" in
                *.md|*.mdx|*.txt|LICENSE|LICENSE.*)
                  ;;
                *)
                  docs_only=false
                  ;;
              esac
            done < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA")
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  validate:
    name: Node.js 24.21.0
    needs: detect-changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify PR base is current
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin main --no-tags
          current_main_sha="$(git rev-parse FETCH_HEAD)"
          if [[ "$EVENT_BASE_SHA" != "$current_main_sha" ]]; then
            echo "::error::main advanced after this PR event. Update the PR branch against current main and rerun CI."
            echo "PR event base: $EVENT_BASE_SHA"
            echo "Current main:  $current_main_sha"
            exit 1
          fi
          echo "PR base matches current main: $current_main_sha"

      - name: Setup Node.js
        if: needs.detect-changes.outputs.docs_only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        if: needs.detect-changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Validate workflow contracts
        if: needs.detect-changes.outputs.docs_only != 'true'
        run: npm run validate:workflows

      - name: Lint
        if: needs.detect-changes.outputs.docs_only != 'true'
        run: npm run lint

      - name: Typecheck
        if: needs.detect-changes.outputs.docs_only != 'true'
        run: npm run typecheck

      - name: Test
        if: needs.detect-changes.outputs.docs_only != 'true'
        run: npm test

      - name: Build
        if: needs.detect-changes.outputs.docs_only != 'true'
        run: npm run build


  # Temporary compatibility shim: Protect main still requires this status context.
  # The real database checks now run only via workflow_dispatch in supabase-database.yml.
  # Remove this skipped job after removing its required context from the repository ruleset.
  supabase-validation:
    name: Validate Supabase migrations
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Database validation is manual-only
        run: echo "Run the Supabase Database CI workflow manually when database changes need validation."
