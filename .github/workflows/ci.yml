name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node.js 24.21.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Detect lightweight and dependency changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          lightweight_only=false
          dependencies_changed=false
          governance_changed=false

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ ! "$PR_CHANGED_FILES" =~ ^[0-9]+$ ]]; then
              echo "::error::Pull request changed-file count is missing or invalid."
              exit 1
            fi
            if (( PR_CHANGED_FILES > 3000 )); then
              echo "::error::This PR exceeds the GitHub API's 3000-file listing limit; CI scope cannot be classified safely."
              exit 1
            fi

            changed_paths_file="$RUNNER_TEMP/ci-changed-paths"
            gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
              | jq -j '.[][] | .filename, "\u0000"' > "$changed_paths_file"
            classification_output="$(node .github/scripts/classify-ci-changes.mjs "$PR_CHANGED_FILES" "$changed_paths_file")"
            lightweight_only_seen=false
            dependencies_changed_seen=false
            governance_changed_seen=false
            while IFS='=' read -r key value; do
              case "$value" in
                true|false) ;;
                *)
                  echo "::error::Classifier returned an invalid boolean value."
                  exit 1
                  ;;
              esac
              case "$key" in
                lightweight_only)
                  [[ "$lightweight_only_seen" == false ]] || { echo "::error::Classifier duplicated lightweight_only."; exit 1; }
                  lightweight_only_seen=true
                  lightweight_only="$value"
                  ;;
                dependencies_changed)
                  [[ "$dependencies_changed_seen" == false ]] || { echo "::error::Classifier duplicated dependencies_changed."; exit 1; }
                  dependencies_changed_seen=true
                  dependencies_changed="$value"
                  ;;
                governance_changed)
                  [[ "$governance_changed_seen" == false ]] || { echo "::error::Classifier duplicated governance_changed."; exit 1; }
                  governance_changed_seen=true
                  governance_changed="$value"
                  ;;
                *)
                  echo "::error::Classifier returned an unexpected output key."
                  exit 1
                  ;;
              esac
            done <<< "$classification_output"
            if [[ "$lightweight_only_seen" != true || "$dependencies_changed_seen" != true || "$governance_changed_seen" != true ]]; then
              echo "::error::Classifier omitted a required output."
              exit 1
            fi
          fi

          echo "lightweight_only=$lightweight_only" >> "$GITHUB_OUTPUT"
          echo "dependencies_changed=$dependencies_changed" >> "$GITHUB_OUTPUT"
          echo "governance_changed=$governance_changed" >> "$GITHUB_OUTPUT"

          # Exercise the CI change classifier before deciding whether to skip the full suite.
          if [[ "$governance_changed" == "true" ]]; then
            node --test .github/scripts/classify-ci-changes.test.mjs
          fi

      - name: Verify PR base is current
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          current_main_sha="$(git rev-parse FETCH_HEAD)"
          if [[ "$EVENT_BASE_SHA" != "$current_main_sha" ]]; then
            echo "::error::main advanced after this PR event. Update the PR branch against current main and rerun CI."
            echo "PR event base: $EVENT_BASE_SHA"
            echo "Current main:  $current_main_sha"
            exit 1
          fi
          echo "PR base matches current main: $current_main_sha"

      - name: Review dependency changes
        if: github.event_name == 'pull_request' && steps.changes.outputs.dependencies_changed == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development

      - name: Setup Node.js
        if: steps.changes.outputs.lightweight_only != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.lightweight_only != 'true'
        run: npm ci

      - name: Lint
        if: steps.changes.outputs.lightweight_only != 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.changes.outputs.lightweight_only != 'true'
        run: npm run typecheck

      - name: Test
        if: steps.changes.outputs.lightweight_only != 'true'
        run: npm test

      - name: Build
        if: steps.changes.outputs.lightweight_only != 'true'
        run: npm run build
