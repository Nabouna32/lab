name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect dependency change
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          dependency_changed=false

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
              while IFS= read -r -d '' path; do
                case "$path" in
                  package.json|package-lock.json)
                    dependency_changed=true
                    break
                    ;;
                esac
              done < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA")
            fi
          elif [[ "$EVENT_NAME" == "push" || "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            dependency_changed=true
          fi

          echo "dependency_changed=$dependency_changed" >> "$GITHUB_OUTPUT"
          echo "Dependency change: $dependency_changed"

      - name: Setup Node.js
        if: steps.changes.outputs.dependency_changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.dependency_changed == 'true'
        run: npm ci

      - name: Audit dependencies
        if: steps.changes.outputs.dependency_changed == 'true'
        run: npm audit --audit-level=high


  validate:
    name: Node.js 24.21.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect documentation-only change
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          docs_only=false

          if [[ "$EVENT_NAME" == "pull_request" || "$EVENT_NAME" == "push" ]]; then
            if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
              docs_only=true
              while IFS= read -r -d '' path; do
                case "$path" in
                  *.md|*.mdx|*.txt|LICENSE|LICENSE.*)
                    ;;
                  *)
                    docs_only=false
                    break
                    ;;
                esac
              done < <(git diff --name-only -z "$BASE_SHA" "$HEAD_SHA")
            fi
          fi

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "Documentation-only change: $docs_only"

      - name: Setup Node.js
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm

      - name: Install dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: npm ci

      - name: Validate agent system
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run validate:agents

      - name: Lint
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run lint

      - name: Typecheck
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run typecheck

      - name: Test
        if: steps.changes.outputs.docs_only != 'true'
        run: npm test

      - name: Restore Next.js build cache
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('next.config.*', 'tsconfig.json', 'src/**', 'app/**', 'pages/**', 'public/**') }}
          restore-keys: |
            next-build-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        if: steps.changes.outputs.docs_only != 'true'
        run: npm run build
