name: Temporary dependency lockfile refresh

on:
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - .github/workflows/temporary-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0

      - name: Regenerate npm lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed lockfile and remove temporary workflow
        env:
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-lock-refresh.yml
          git add package-lock.json
          git commit -m "chore(deps): refresh lockfile for security patches"
          git push origin "HEAD:${BRANCH_NAME}"
