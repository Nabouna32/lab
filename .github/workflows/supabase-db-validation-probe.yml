name: Probe temporaire validation SQL Supabase

on:
  push:
    branches:
      - test/supabase-db-validation

permissions:
  contents: read

jobs:
  database:
    name: Migrations, pgTAP et lint PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer la CLI Supabase épinglée
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.122.0

      - name: Démarrer PostgreSQL et appliquer toutes les migrations
        id: db_start
        run: supabase db start

      - name: Exécuter tous les tests pgTAP
        id: pgtap
        run: supabase test db

      - name: Linter le schéma PostgreSQL
        if: always() && steps.db_start.outcome == 'success'
        run: supabase db lint --local --fail-on error

      - name: Arrêter la base locale
        if: always() && steps.db_start.outcome != 'skipped'
        run: supabase stop
