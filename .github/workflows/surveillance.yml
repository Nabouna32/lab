name: Surveillance quotidienne

on:
  push:
    branches:
      - test/supabase-db-validation
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Branche, tag ou SHA à auditer et tester"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

concurrency:
  group: surveillance-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  audit-dependances:
    name: Audit complet des dépendances npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer la révision demandée
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Auditer le graphe npm verrouillé
        run: node .github/scripts/run-npm-audit.mjs

  probe-supabase:
    name: Probe Supabase CLI et validation PostgreSQL seule
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer la CLI Supabase épinglée
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3
        with:
          version: 2.122.0

      - name: Découvrir les commandes disponibles
        run: |
          supabase --version
          supabase db start --help
          supabase test db --help
          supabase db lint --help

      - name: Démarrer PostgreSQL et appliquer les migrations
        run: supabase db start

      - name: Exécuter les tests pgTAP
        run: supabase test db

      - name: Analyser les fonctions SQL
        run: supabase db lint --local --fail-on error

      - name: Arrêter la base locale
        if: always()
        run: supabase stop

  tests-navigateur:
    name: Tests des parcours critiques — Playwright Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer la révision demandée
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Installer Playwright Test (version stable épinglée)
        run: npm install --no-save --package-lock=false @playwright/test@1.64.1

      - name: Installer Chromium et ses dépendances système
        run: npx playwright install --with-deps chromium

      - name: Construire l'application de production
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_local_placeholder"
        run: npm run build

      - name: Exécuter les parcours critiques et contrôles WCAG
        run: npx playwright test
        env:
          CI: "true"

      - name: Publier les preuves en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-evidence-${{ github.run_id }}
          path: artifacts/browser/
          if-no-files-found: ignore
          retention-days: 7
