name: Surveillance quotidienne

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Révision facultative ; laisser vide pour utiliser la branche choisie dans le sélecteur GitHub"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: surveillance-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  audit-dependances:
    name: Audit complet des dépendances npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer la révision demandée
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Auditer le graphe npm verrouillé
        run: node .github/scripts/run-npm-audit.mjs

  tests-navigateur:
    name: Tests des parcours critiques — Playwright Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer la révision demandée
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false

      - name: Installer Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Installer Playwright Test (version stable épinglée)
        run: npm install --no-save --package-lock=false @playwright/test@1.64.1

      - name: Installer Chromium et ses dépendances système
        run: npx playwright install --with-deps chromium

      - name: Construire l'application de production
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_local_placeholder"
        run: npm run build

      - name: Exécuter les parcours critiques et contrôles WCAG
        run: npx playwright test
        env:
          CI: "true"

      - name: Publier les preuves en cas d'échec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-evidence-${{ github.run_id }}
          path: artifacts/browser/
          if-no-files-found: ignore
          retention-days: 7
